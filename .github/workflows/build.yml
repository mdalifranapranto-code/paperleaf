name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 pdfjs-dist@3.11.174
          mkdir www
          cp ../index.html www/index.html
          cp node_modules/pdfjs-dist/build/pdf.min.js www/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/##g' www/index.html
          echo '{"appId":"com.boighor.app","appName":"বইঘর","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Boighor-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
